groups:
  - name: uptime
    rules:
      - alert: ServiceDown
        expr: uptime_target_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.target }} has been down for over a minute"

      - alert: SlowResponse
        expr: uptime_response_seconds > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.target }} has taken over 2 s to answer for 5 minutes"

      - alert: WorkerStalled
        expr: time() - uptime_last_round_timestamp_seconds > 120
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "The checker has not finished a round in over 2 minutes"

      - alert: ScrapeFailing
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.job }}"
