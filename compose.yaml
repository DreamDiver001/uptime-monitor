name: uptime

x-app: &app
  image: uptime-monitor:local
  build: .
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  environment:
    DATABASE_URL: postgresql://uptime:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/uptime
    REDIS_URL: redis://redis:6379/0
    CHECK_INTERVAL: ${CHECK_INTERVAL:-30}
    SEED_TARGETS: ${SEED_TARGETS:-}
    PGTZ: ${TZ:-Europe/Budapest}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    networks: [frontend]

  web:
    <<: *app
    healthcheck:
      test: ["CMD", "python", "-m", "uptime.healthcheck", "http://localhost:8000/readyz"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks: [frontend, backend]

  worker:
    <<: *app
    command: ["python", "-m", "uptime.worker"]
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-m", "uptime.healthcheck", "heartbeat", "/tmp/worker-heartbeat", "60"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks: [backend]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: uptime
      POSTGRES_DB: uptime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "uptime", "-d", "uptime"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks: [backend]

  grafana:
    image: grafana/grafana:13.2.6
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/uptime.json
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [backend]

volumes:
  pgdata:
  prometheus-data:
  grafana-data:

networks:
  frontend:
  backend:
